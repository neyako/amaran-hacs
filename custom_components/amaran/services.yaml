request_power_status:
  name: Request power status
  description: Debug tool that asks a light for its power report and logs the replies.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID of the light.
      required: false
      selector:
        text:
    node_address:
      name: Light address
      description: Address of the light, such as 0x000b.
      required: false
      selector:
        text:
    capture_seconds:
      name: Capture seconds
      description: Seconds to keep logging replies after the request.
      required: false
      default: 10
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds
